[project]
name = "x-scout"
version = "0.1.0"
description = "Local X (Twitter) topic scout: real-browser search, virality scoring, Claude ranking"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexander Ivanenko" }]
keywords = ["twitter", "x", "scraper", "playwright", "claude", "claude-code", "virality"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://sentimenta1ist.github.io/x-scout/"
Repository = "https://github.com/Sentimenta1ist/x-scout"

[project.scripts]
x-scout = "x_scout.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
